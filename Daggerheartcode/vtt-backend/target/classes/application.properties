# =============================================================================
# Daggerheart VTT - Configuración del Servidor
# =============================================================================

server.port=8080

# =============================================================================
# H2 - Base de datos embebida (para sprints futuros)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:daggerheart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console disponible en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================================
# Logging
# =============================================================================
logging.level.com.daggerheart=DEBUG
logging.level.org.springframework.web.socket=INFO

# =============================================================================
# Carpeta Externa de Datos JSON (Sprint 16)
# =============================================================================
daggerheart.data.folder=/home/duckyrichii/Escritorio/codigos/base de datos/Daggerheartcode/Jsons

