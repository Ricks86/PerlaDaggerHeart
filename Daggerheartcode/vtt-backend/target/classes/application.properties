# =============================================================================
# Daggerheart VTT - Configuración del Servidor
# =============================================================================

server.port=8080

# =============================================================================
# PostgreSQL - Base de datos persistente (Docker: daggerheart-postgres)
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/daggerheart_db
spring.datasource.username=dagger_admin
spring.datasource.password=dagger_secret_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# =============================================================================
# Logging
# =============================================================================
logging.level.com.daggerheart=DEBUG
logging.level.org.springframework.web.socket=INFO

# =============================================================================
# Carpeta Externa de Datos JSON (Sprint 16)
# =============================================================================
daggerheart.data.folder=/home/duckyrichii/Escritorio/codigos/base de datos/Daggerheartcode/Jsons

